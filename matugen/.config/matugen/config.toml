[config]
import_json_files = ["./theme.json"]

[templates.vscode-raw]
input_path = './templates/vscode-colors'
output_path = '~/.cache/matugen/vscode-colors'

[templates.vscode-json]
input_path = './templates/vscode-colors.json'
output_path = '~/.cache/matugen/vscode-colors.json'

[templates.kitty]
input_path = './templates/kitty.conf'
output_path = '~/.config/kitty/themes/Matugen.conf'
post_hook = 'kitten themes --reload-in=all Matugen'

[templates.waybar]
input_path = './templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'

[templates.hypr]
input_path = './templates/hypr-borders.lua'
output_path = '~/.config/hypr/matugen_colors.lua'
post_hook = 'hyprctl reload'

[templates.pywalfox]
input_path = "~/.config/matugen/templates/pywalfox.json"
output_path = "~/.cache/wal/colors.json"
post_hook = "pywalfox update"

[templates.gtk]
input_path = './templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
post_hook = '~/.config/matugen/scripts/reload-gtk.sh'
